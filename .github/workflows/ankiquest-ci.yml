# Builds and tests the Android companion on every pull request and on master.
# The watch app is not built: the Connect IQ SDK is not freely downloadable.
name: ankiquest CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  gradle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew assembleDebug lintDebug testDebugUnitTest

  # The flake's formatting check, and a debug build inside its dev shell.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - run: nix flake check
      - run: nix develop -c sh -c 'cd android && ./gradlew assembleDebug'
