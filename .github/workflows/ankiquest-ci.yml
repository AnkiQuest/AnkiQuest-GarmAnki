# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds and tests the Android companion on every pull request and on master.
# The watch app is not built: the Connect IQ SDK is not freely downloadable.
# The jobs are AnkiQuest-Dev's shared android-ci workflow.
name: ankiquest CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  ci:
    uses: AnkiQuest/AnkiQuest-Dev/.github/workflows/android-ci.yml@master
    with:
      working-directory: android
