# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds debug APKs on every push to master, one per ABI and a universal one,
# and publishes them as the "nightly" pre-release, replacing the previous one.
# The newest builds are always at
#   https://github.com/AnkiQuest/AnkiQuest-GarmAnki/releases/download/nightly/AnkiQuest-GarmAnki-nightly-<abi>.apk
# for arm64-v8a, armeabi-v7a, x86_64, x86 and universal.
# The job is AnkiQuest-Dev's shared android-release workflow.
name: Nightly

on:
  push:
    branches: [master]
  workflow_dispatch:

# A newer push replaces a nightly that is still building.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nightly:
    uses: AnkiQuest/AnkiQuest-Dev/.github/workflows/android-release.yml@master
    permissions:
      contents: write
    with:
      name: AnkiQuest-GarmAnki
      working-directory: android
      gradle-args: -PabiSplits=true
    secrets:
      DEBUG_KEYSTORE: ${{ secrets.NIGHTLY_DEBUG_KEYSTORE }}
