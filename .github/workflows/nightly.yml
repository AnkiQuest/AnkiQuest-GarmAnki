# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds a debug APK on every push to master and publishes it as the
# "nightly" pre-release, replacing the previous one. The newest build is
# always at
#   https://github.com/AnkiQuest/AnkiQuest-GarmAnki/releases/download/nightly/AnkiQuest-GarmAnki-nightly.apk
# The job is AnkiQuest-Dev's shared android-nightly workflow.
name: Nightly

on:
  push:
    branches: [master]
  workflow_dispatch:

# A newer push replaces a nightly that is still building.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nightly:
    uses: AnkiQuest/AnkiQuest-Dev/.github/workflows/android-nightly.yml@master
    permissions:
      contents: write
    with:
      name: AnkiQuest-GarmAnki
      working-directory: android
    secrets:
      NIGHTLY_DEBUG_KEYSTORE: ${{ secrets.NIGHTLY_DEBUG_KEYSTORE }}
